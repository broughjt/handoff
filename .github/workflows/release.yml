name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            architecture: x64
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            architecture: arm64
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    env:
      NAME: handoff-${{ github.ref_name }}-${{ matrix.system }}
    steps:
      - uses: actions/checkout@v7
      - uses: Bogdanp/setup-racket@v1.16
        with:
          architecture: ${{ matrix.architecture }}
          distribution: minimal
          variant: CS
          version: "9.3"
      - name: Build
        run: |
          raco pkg install --batch --auto --no-docs --name handoff --link "$PWD"
          mkdir build
          raco exe -o build/handoff handoff/main.rkt
          raco distribute "$NAME" build/handoff
          mkdir -p "$NAME/share/skills/handoff"
          cp -r skills/. "$NAME/share/skills/handoff"
      - name: Test
        run: |
          raco test handoff/tests
          "$NAME/bin/handoff" workflow list | grep -qx 'name: agent-implements'
          cmp "$("$NAME/bin/handoff" guide)" HANDOFF.md
      - run: tar -czf "$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.system }}
          path: ${{ env.NAME }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ $GITHUB_REF_NAME == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" handoff-*.tar.gz --repo "$GITHUB_REPOSITORY" --generate-notes "${prerelease[@]}"
